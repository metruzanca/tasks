[tools]
go = "1.27.0"
"go:github.com/bufbuild/buf/cmd/buf" = "1.74.0"
"go:google.golang.org/protobuf/cmd/protoc-gen-go" = "1.36.12"
"go:google.golang.org/grpc/cmd/protoc-gen-go-grpc" = "1.6.2"

[tasks.default]
description = "Build the CLI and bundled plugins"
depends = ["build"]

[tasks.all]
description = "Build the CLI and bundled plugins"
depends = ["build"]

[tasks.build]
description = "Build the CLI and bundled plugins into ./bin"
depends = ["tasks", "plugin-github", "plugin-linear"]

[tasks.tasks]
description = "Build the tasks CLI"
run = 'mkdir -p "${BIN:-bin}" && go build -ldflags "-X main.version=${VERSION:-dev}" -o "${BIN:-bin}/tasks" .'

[tasks.plugin-github]
description = "Build the external GitHub plugin"
run = 'mkdir -p "${BIN:-bin}" && go build -o "${BIN:-bin}/tasks-plugin-github" ./cmd/tasks-plugin-github'

[tasks.plugin-linear]
description = "Build the external Linear plugin"
run = 'mkdir -p "${BIN:-bin}" && go build -o "${BIN:-bin}/tasks-plugin-linear" ./cmd/tasks-plugin-linear'

[tasks.install]
description = "Install tasks and the bundled plugins with go install"
run = 'go install -ldflags "-X main.version=${VERSION:-dev}" . ./cmd/tasks-plugin-github ./cmd/tasks-plugin-linear'

[tasks.test]
description = "Run the test suite"
run = "go test ./..."

[tasks.lint]
description = "Run go vet"
run = "go vet ./..."

[tasks.fmt]
description = "Format Go sources"
run = "gofmt -w ./cmd ./internal ./pkg ./plugins"

[tasks.generate]
description = "Regenerate protobuf and gRPC stubs"
run = "buf generate"

[tasks.clean]
description = "Remove build output"
run = 'rm -rf "${BIN:-bin}"'
